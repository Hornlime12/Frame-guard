<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 336" width="336" height="336" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- pink (unstable) -> cyan (guard) -> blue (stable), one continuous gradient along x -->
    <linearGradient id="lineG" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="336" y2="0">
      <stop offset="0" stop-color="#FF7FA8"/>
      <stop offset=".3" stop-color="#55D6FF"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </linearGradient>
    <!-- very faint area under the stable line only -->
    <linearGradient id="calmFill" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="336">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background: slightly warm before the guard, slightly cool after it -->
  <rect width="336" height="336" fill="#171424"/>
  <rect x="166" width="170" height="336" fill="#0E1730"/>

  <!-- stable region: faint fill -->
  <path fill="url(#calmFill)" d="M166 187 L172 184 L190 193 L206 187 L226 191 L240 183 L262 190 L280 194 L298 187 L318 191 L340 186 L340 336 L156 336 Z"/>

  <!-- frametime line: sharp spikes (tallest one hits the guard) -> flat, slightly irregular angular line -->
  <path fill="none" stroke="url(#lineG)" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"
        d="M0 200 L14 200 L28 150 L42 204 L60 118 L74 208 L96 82 L110 210 L122 212 L140 54 L156 190 L172 184 L190 193 L206 187 L226 191 L240 183 L262 190 L280 194 L298 187 L318 191 L340 186"/>

  <!-- guard line: runs edge to edge, never cut -->
  <rect x="161" y="0" width="10" height="336" fill="#55D6FF"/>
</svg>
